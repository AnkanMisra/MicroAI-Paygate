name: Merge Command Bot

on:
  issue_comment:
    types: [created]

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: merge-command-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.issue.pull_request != null &&
      github.actor == 'AnkanMisra' &&
      github.event.comment.body == '/merge'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate, wait, and merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MERGE_BOT_TOKEN: ${{ secrets.MERGE_BOT_TOKEN }}
        with:
          script: |
            const mergeCommand = require('./.github/scripts/merge-command.js');
            await mergeCommand.run({
              github,
              context,
              core,
              token: process.env.MERGE_BOT_TOKEN,
            });
