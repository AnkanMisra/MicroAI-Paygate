name: Web Lint & Build

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docker-compose.yml'
      - '.github/workflows/web-lint-build.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docker-compose.yml'
      - '.github/workflows/web-lint-build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install deps
        working-directory: web
        run: bun install

      - name: Lint (eslint)
        working-directory: web
        run: bun run lint

      - name: Typecheck (tsc)
        working-directory: web
        run: bun run typecheck

      - name: Unit tests (Bun)
        working-directory: web
        run: bun run test:unit --coverage --coverage-reporter=lcov

      - name: Upload web coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

      - name: Build (Next.js)
        working-directory: web
        run: bun run build
