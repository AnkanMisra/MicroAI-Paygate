# deploy/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: microai-gateway
    static_configs:
      - targets: ["gateway:3000"]
    metrics_path: /metrics

  - job_name: microai-verifier
    static_configs:
      - targets: ["verifier:3002"]
    metrics_path: /metrics
