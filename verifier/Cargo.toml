[package]
name = "verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ethers = "2.0"
hex = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
# Combined tower entries into one line
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["limit"] }
dashmap = "6.2.1"
redis = { version = "0.27", features = ["aio", "tokio-comp"] }

[dev-dependencies]
# Optional: move testing-only tools here if they aren't needed for the main build
# tower = { version = "0.5", features = ["util"] }
