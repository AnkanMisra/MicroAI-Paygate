name: Label Taxonomy Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.json'
      - '.github/workflows/label-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout taxonomy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update managed labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = require('./.github/labels.json');
            const existing = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { ...context.repo, per_page: 100 },
            );
            const byName = new Map(existing.map((label) => [label.name, label]));

            for (const label of labels) {
              if (byName.has(label.name)) {
                await github.rest.issues.updateLabel({
                  ...context.repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description,
                });
              } else {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }
