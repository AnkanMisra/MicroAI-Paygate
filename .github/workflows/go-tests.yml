name: Go Tests

on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'deploy/fly/gateway.fly.toml'
      - 'docker-compose.yml'
      - '.github/workflows/go-tests.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'deploy/fly/gateway.fly.toml'
      - 'docker-compose.yml'
      - '.github/workflows/go-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: gateway/go.sum

      - name: Run Go tests
        working-directory: gateway
        run: go test -v -covermode=atomic -coverprofile=coverage.out ./...
        env:
          REDIS_URL: localhost:6379

      - name: Upload gateway coverage
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          use_oidc: true
          files: gateway/coverage.out
          flags: gateway
          fail_ci_if_error: false
