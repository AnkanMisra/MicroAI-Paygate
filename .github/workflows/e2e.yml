name: E2E Tests

on:
  pull_request:
    paths:
      - 'gateway/**'
      - 'verifier/**'
      - 'tests/**'
      - 'run_e2e.sh'
      - 'deploy/**'
      - 'DEPLOY.md'
      - '.env.production.example'
      - 'docker-compose.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'verifier/**'
      - 'tests/**'
      - 'run_e2e.sh'
      - 'deploy/**'
      - 'DEPLOY.md'
      - '.env.production.example'
      - 'docker-compose.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'z-ai/glm-4.5-air:free' }}
      RECEIPT_STORE: memory
      CACHE_ENABLED: "false"
      PAYGATE_AUDIENCE: http://localhost:3000
      MIN_AUTHORIZATION_VERSION: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Prep Go/Rust deps
        run: |
          go mod download -C gateway
          cargo fetch --manifest-path verifier/Cargo.toml

      - name: Run deterministic E2E
        run: |
          chmod +x ./run_e2e.sh
          timeout 150 ./run_e2e.sh
