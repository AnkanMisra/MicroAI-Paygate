version: 2
updates:
  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/verifier"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  # Bun dependencies (web)
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "TypeScript"]
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  # Bun dependencies (TypeScript SDK)
  - package-ecosystem: "bun"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "TypeScript"]
    groups:
      sdk-minor-and-patch:
        update-types: ["minor", "patch"]

  # Bun dependencies (root)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "TypeScript"]
    groups:
      root-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github_actions", "type:devops"]
    groups:
      github-actions:
        patterns: ["*"]
