version: 2
updates:
  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    # Hold releases that cannot pass the documented Go 1.24 CI/security policy.
    # Reassess each exact version when the project moves to Go 1.25.
    ignore:
      - dependency-name: "github.com/gin-contrib/cors"
        versions: ["v1.7.7"]
      - dependency-name: "github.com/gin-contrib/gzip"
        versions: ["v1.2.6"]
      - dependency-name: "github.com/gin-gonic/gin"
        versions: ["v1.12.0"]
      # v1.17.3-v1.17.4 pin vulnerable x/crypto releases; fixes require Go 1.25.
      - dependency-name: "github.com/ethereum/go-ethereum"
        versions: ["v1.17.3", "v1.17.4"]
    groups:
      go-patch:
        update-types: ["patch"]

  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/verifier"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      rust-minor-and-patch:
        update-types: ["minor", "patch"]

  # Bun dependencies (web)
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "TypeScript"]
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  # Bun dependencies (TypeScript SDK)
  - package-ecosystem: "bun"
    directory: "/sdk/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "TypeScript"]
    groups:
      sdk-minor-and-patch:
        update-types: ["minor", "patch"]

  # Bun dependencies (root)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "TypeScript"]
    groups:
      root-minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github_actions", "type:devops"]
    groups:
      github-actions:
        patterns: ["*"]
